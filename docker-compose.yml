# ЛР №5: общий шаблон шарда — независимый PostgreSQL с таблицей задач (docker/postgres/shard-init.sql)
x-postgres-shard: &postgres-shard
  image: postgres:16-alpine
  shm_size: 256mb
  environment:
    POSTGRES_USER: taskmanager
    POSTGRES_PASSWORD: taskmanager_password
    POSTGRES_DB: taskmanager_shard
  networks:
    - taskmanager-network
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager_shard"]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmanager-postgres
    # 64 МБ /dev/shm по умолчанию не хватает параллельным VACUUM и запросам на миллионах строк
    shm_size: 512mb
    # ЛР №4: Primary — принимает запись и отдаёт WAL реплике. Параметры репликации заданы явно,
    # хотя в PostgreSQL 16 они и так по умолчанию такие: так их видно в конфигурации проекта
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      # Слот репликации держит WAL, пока Replica их не получит; ограничение не даёт
      # заполнить диск, если Replica надолго выключена
      - -c
      - max_slot_wal_keep_size=2GB
      # Имя экземпляра видно в логах и в pg_stat_replication
      - -c
      - cluster_name=taskmanager-primary
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager_password
      POSTGRES_DB: taskmanager_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - taskmanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:16-alpine
    container_name: taskmanager-postgres-replica
    shm_size: 256mb
    depends_on:
      postgres:
        condition: service_healthy
    # При первом запуске entrypoint снимает базовую копию Primary через pg_basebackup
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      # hot_standby разрешает читать с Replica, пока она применяет WAL
      - -c
      - hot_standby=on
      # Replica сообщает Primary, какие строки ей ещё нужны: длинные запросы на Replica
      # не будут отменяться из-за VACUUM на Primary
      - -c
      - hot_standby_feedback=on
      # Имя реплики видно на Primary в pg_stat_replication.application_name
      - -c
      - cluster_name=taskmanager-replica
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager_password
      POSTGRES_DB: taskmanager_db
      PRIMARY_HOST: postgres
      PRIMARY_PORT: 5432
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator_password
      REPLICATION_SLOT: replica_slot
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./scripts:/scripts:ro
    networks:
      - taskmanager-network
    healthcheck:
      # Replica здорова, когда принимает подключения и находится в режиме восстановления
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager_db && psql -U taskmanager -d taskmanager_db -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-shard-0:
    <<: *postgres-shard
    container_name: taskmanager-shard-0
    ports:
      - "5440:5432"
    volumes:
      - shard_0_data:/var/lib/postgresql/data
      - ./docker/postgres/shard-init.sql:/docker-entrypoint-initdb.d/01-shard.sql:ro

  postgres-shard-1:
    <<: *postgres-shard
    container_name: taskmanager-shard-1
    ports:
      - "5441:5432"
    volumes:
      - shard_1_data:/var/lib/postgresql/data
      - ./docker/postgres/shard-init.sql:/docker-entrypoint-initdb.d/01-shard.sql:ro

  postgres-shard-2:
    <<: *postgres-shard
    container_name: taskmanager-shard-2
    ports:
      - "5442:5432"
    volumes:
      - shard_2_data:/var/lib/postgresql/data
      - ./docker/postgres/shard-init.sql:/docker-entrypoint-initdb.d/01-shard.sql:ro

  # Четвёртый шард для опыта «3 → 4 шарда»: запускается отдельно,
  # docker compose --profile scale up -d postgres-shard-3
  postgres-shard-3:
    <<: *postgres-shard
    container_name: taskmanager-shard-3
    profiles: ["scale"]
    ports:
      - "5443:5432"
    volumes:
      - shard_3_data:/var/lib/postgresql/data
      - ./docker/postgres/shard-init.sql:/docker-entrypoint-initdb.d/01-shard.sql:ro

  redis:
    image: redis:7-alpine
    container_name: taskmanager-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taskmanager-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:4.25
    container_name: taskmanager-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/liquibase:/liquibase/changelog
    command: >
      --url=jdbc:postgresql://postgres:5432/taskmanager_db
      --username=taskmanager
      --password=taskmanager_password
      --changeLogFile=changelog/db.changelog-master.xml
      update
    networks:
      - taskmanager-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager-api
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      postgres-shard-0:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
      postgres-shard-2:
        condition: service_healthy
      redis:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=taskmanager_db;Username=taskmanager;Password=taskmanager_password
      # ЛР №4: чтение списков задач идёт на Replica, запись — на Primary
      ConnectionStrings__ReplicaConnection: Host=postgres-replica;Port=5432;Database=taskmanager_db;Username=taskmanager;Password=taskmanager_password
      ConnectionStrings__Redis: redis:6379
      # ЛР №5: шарды задач. Первые Sharding__ActiveShards из списка принимают данные.
      # ЛР №6: Timeout=3 — недоступный шард обнаруживается за 3 секунды, а не за 15 по умолчанию
      Sharding__Shards__0__ConnectionString: Host=postgres-shard-0;Port=5432;Database=taskmanager_shard;Username=taskmanager;Password=taskmanager_password;Timeout=3
      Sharding__Shards__1__ConnectionString: Host=postgres-shard-1;Port=5432;Database=taskmanager_shard;Username=taskmanager;Password=taskmanager_password;Timeout=3
      Sharding__Shards__2__ConnectionString: Host=postgres-shard-2;Port=5432;Database=taskmanager_shard;Username=taskmanager;Password=taskmanager_password;Timeout=3
      Sharding__Shards__3__ConnectionString: Host=postgres-shard-3;Port=5432;Database=taskmanager_shard;Username=taskmanager;Password=taskmanager_password;Timeout=3
      # Алерты о партициях (ЛР №3): токен и чат берутся из локального .env, он не коммитится
      Alerts__Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Alerts__Telegram__ChatId: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "5000:8080"
    networks:
      - taskmanager-network

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: taskmanager-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - taskmanager-network

  grafana:
    image: grafana/grafana:10.2.2
    container_name: taskmanager-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - taskmanager-network

volumes:
  postgres_data:
  postgres_replica_data:
  shard_0_data:
  shard_1_data:
  shard_2_data:
  shard_3_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  taskmanager-network:
    driver: bridge
