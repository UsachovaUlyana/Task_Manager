services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmanager-postgres
    # 64 МБ /dev/shm по умолчанию не хватает параллельным VACUUM и запросам на миллионах строк
    shm_size: 512mb
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager_password
      POSTGRES_DB: taskmanager_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    networks:
      - taskmanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskmanager-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taskmanager-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:4.25
    container_name: taskmanager-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/liquibase:/liquibase/changelog
    command: >
      --url=jdbc:postgresql://postgres:5432/taskmanager_db
      --username=taskmanager
      --password=taskmanager_password
      --changeLogFile=changelog/db.changelog-master.xml
      update
    networks:
      - taskmanager-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=taskmanager_db;Username=taskmanager;Password=taskmanager_password
      ConnectionStrings__Redis: redis:6379
    ports:
      - "5000:8080"
    networks:
      - taskmanager-network

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: taskmanager-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - taskmanager-network

  grafana:
    image: grafana/grafana:10.2.2
    container_name: taskmanager-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - taskmanager-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  taskmanager-network:
    driver: bridge
