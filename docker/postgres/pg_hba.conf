# ЛР №4: правила подключения для Primary и Replica (параметр hba_file в docker-compose.yml).
# Стандартный файл из initdb разрешает репликацию только с localhost, поэтому Replica
# не смогла бы подключиться к Primary из соседнего контейнера.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Локальные подключения внутри контейнера (psql, healthcheck, pg_isready)
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Приложение и psql с хоста: только по паролю
host    all             all             all                     scram-sha-256

# Подключения репликации: Replica приходит по сети docker как роль replicator
local   replication     all                                     trust
host    replication     all             all                     scram-sha-256
